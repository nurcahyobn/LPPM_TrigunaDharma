
services:
  # ─── FRONTEND (React + Vite + Nginx) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.lppm.trigunadharma.ac.id/api/v1}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ─── BACKEND API (Go) ────────────────────────────────────
  backend:
    build:
      context: ./backend_go
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - app-network
      - coolify
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}

      # PostgreSQL external - Coolify
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL wajib diisi}

      CORS_ORIGIN: ${CORS_ORIGIN:-https://lppm.trigunadharma.ac.id}
      TRUST_PROXY: ${TRUST_PROXY:-true}

      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-500}

      APP_NAME: ${APP_NAME:-LPPM Triguna Dharma}
      FRONTEND_URL: ${FRONTEND_URL:-https://lppm.trigunadharma.ac.id}

      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      # Automated backup
      BACKUP_OTOMATIS: ${BACKUP_OTOMATIS:-true}
      BACKUP_DIR: /app/backups
      BACKUP_HARI: ${BACKUP_HARI:-1}
      BACKUP_JAM: ${BACKUP_JAM:-2}
      BACKUP_ZONA: ${BACKUP_ZONA:-Asia/Jakarta}

    volumes:
      - backend_backups:/app/backups
      - backend_logs:/app/logs

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

# ─── PERSISTENT VOLUMES ───────────────────────────────────
volumes:
  backend_backups:
    name: lppm_backend_backups
  backend_logs:
    name: lppm_backend_logs

# ─── NETWORKS ─────────────────────────────────────────────
networks:
  app-network:
    name: lppm_app_network
    driver: bridge

  # Network existing milik Coolify
  coolify:
    name: coolify
    external: true
